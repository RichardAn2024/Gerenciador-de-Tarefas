<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - VolControl</title>
    <link rel="icon" type="image/png" href="images/simbolicon.png" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page"
    style="background-image: url('https://raw.githubusercontent.com/RichardAn2024/Gerenciador-de-Tarefas/main/images/VolControl.png'); background-size: cover; background-position: center;">

    <div class="auth-container">
        <div class="circle-decoration"></div>
        <div class="circle-decoration"></div>

        <div class="auth-box">
            <div class="auth-logo">
                <div class="logo-icon">
                    <img src="https://raw.githubusercontent.com/RichardAn2024/Gerenciador-de-Tarefas/main/images/VolControl.png"
                        alt="VolControl" class="logo-img" />
                </div>
                <div class="logo-text">Vol<span>Control</span></div>
            </div>

            <h2>Bem-vindo de volta</h2>
            <p>Faça login para acessar suas tarefas</p>

            <div id="mensagemErro" class="auth-error" style="display:none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required />
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required />
                </div>

                <div style="text-align: right; margin-bottom: 16px;">
                    <a href="recuperar.html" style="color: #F57C00; font-size: 14px; text-decoration: none;">
                        🔑 Esqueci minha senha
                    </a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Entrar</button>
            </form>

            <div class="auth-links">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
