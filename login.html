<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Volmanday</title>
    <link rel="icon" type="image/png" href="images/simbolicon.png" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page"
    style="background-image: url('https://media2.dev.to/dynamic/image/width=1000,height=420,fit=cover,gravity=auto,format=auto/https%3A%2F%2Fdev-to-uploads.s3.us-east-2.amazonaws.com%2Fuploads%2Farticles%2F2j2aslxwtdi7f3ax7i0o.jpg'); background-size: cover; background-position: center;">

    <div class="auth-container">
        <div class="circle-decoration"></div>
        <div class="circle-decoration"></div>

        <div class="auth-box">
            <div class="auth-logo">
                <div class="logo-icon">
                    <img src="https://media2.dev.to/dynamic/image/width=1000,height=420,fit=cover,gravity=auto,format=auto/https%3A%2F%2Fdev-to-uploads.s3.us-east-2.amazonaws.com%2Fuploads%2Farticles%2Fx78i6u1vmfbzrvvie5xe.png"
                        alt="Volmanday" class="logo-img" />
                </div>
                <div class="logo-text">Vol<span>manday</span></div>
            </div>

            <h2>Bem-vindo de volta</h2>
            <p>Faça login para acessar suas tarefas</p>

            <div id="mensagemErro" class="auth-error" style="display:none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required />
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn btn-primary btn-full">Entrar</button>
            </form>

            <div class="auth-links">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
