<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir Senha - VolControl</title>
    <link rel="icon" type="image/png" href="images/simbolicon.png" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page"
    style="background-image: url('https://raw.githubusercontent.com/RichardAn2024/Gerenciador-de-Tarefas/main/images/VolControl.png'); background-size: cover; background-position: center;">

    <div class="auth-container">
        <div class="circle-decoration"></div>
        <div class="circle-decoration"></div>

        <div class="auth-box">
            <div class="auth-logo">
                <div class="logo-icon">
                    <img src="https://raw.githubusercontent.com/RichardAn2024/Gerenciador-de-Tarefas/main/images/VolControl.png"
                        alt="VolControl" class="logo-img" />
                </div>
                <div class="logo-text">Vol<span>Control</span></div>
            </div>

            <h2>🔐 Redefinir Senha</h2>
            <p>Digite o código recebido por email e sua nova senha</p>

            <div id="mensagemSucesso" class="auth-success" style="display:none;"></div>
            <div id="mensagemErro" class="auth-error" style="display:none;"></div>

            <form id="resetarForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="resetarEmail" placeholder="seu@email.com" required readonly />
                </div>

                <div class="form-group">
                    <label>Código de verificação</label>
                    <input type="text" id="resetarCodigo" placeholder="Digite o código recebido" required />
                    <small style="color: rgba(255,255,255,0.6); font-size: 12px; display: block; margin-top: 4px;">
                        O código foi enviado para seu email
                    </small>
                </div>

                <div class="form-group">
                    <label>Nova senha</label>
                    <input type="password" id="resetarSenha" placeholder="Mínimo 6 caracteres" required minlength="6" />
                </div>

                <div class="form-group">
                    <label>Confirmar nova senha</label>
                    <input type="password" id="resetarConfirmarSenha" placeholder="Digite novamente" required />
                </div>

                <button type="submit" class="btn btn-primary btn-full">🔒 Redefinir senha</button>
            </form>

            <div class="auth-links">
                <p><a href="login.html">← Voltar para o login</a></p>
            </div>
        </div>
    </div>

    <style>
        .auth-success {
            background: rgba(232, 245, 233, 0.9);
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            border-left: 4px solid #2e7d32;
            backdrop-filter: blur(4px);
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');

            const emailInput = document.getElementById('resetarEmail');
            if (email) {
                emailInput.value = decodeURIComponent(email);
            }

            const form = document.getElementById('resetarForm');
            const msgSucesso = document.getElementById('mensagemSucesso');
            const msgErro = document.getElementById('mensagemErro');

            const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:8080/api'
                : window.location.origin + '/api';

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                msgSucesso.style.display = 'none';
                msgErro.style.display = 'none';

                const email = emailInput.value.trim();
                const codigo = document.getElementById('resetarCodigo').value.trim();
                const senha = document.getElementById('resetarSenha').value;
                const confirmarSenha = document.getElementById('resetarConfirmarSenha').value;

                if (!codigo) {
                    msgErro.textContent = 'Digite o código de verificação.';
                    msgErro.style.display = 'block';
                    return;
                }

                if (senha.length < 6) {
                    msgErro.textContent = 'A senha deve ter pelo menos 6 caracteres.';
                    msgErro.style.display = 'block';
                    return;
                }

                if (senha !== confirmarSenha) {
                    msgErro.textContent = 'As senhas não coincidem.';
                    msgErro.style.display = 'block';
                    return;
                }

                try {
                    const response = await fetch(`${API_URL}/resetar-senha`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, codigo, novaSenha: senha })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        msgSucesso.textContent = data.mensagem || '✅ Senha redefinida com sucesso!';
                        msgSucesso.style.display = 'block';

                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 3000);
                    } else {
                        msgErro.textContent = data.erro || 'Erro ao redefinir senha.';
                        msgErro.style.display = 'block';
                    }
                } catch (error) {
                    console.error('❌ Erro ao redefinir senha:', error);
                    msgErro.textContent = 'Erro de conexão com o servidor.';
                    msgErro.style.display = 'block';
                }
            });
        });
    </script>
</body>

</html>
