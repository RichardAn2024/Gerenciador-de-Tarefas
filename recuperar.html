<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha - VolControl</title>
    <link rel="icon" type="image/png" href="images/simbolicon.png" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page"
    style="background-image: url('https://raw.githubusercontent.com/RichardAn2024/Gerenciador-de-Tarefas/main/images/VolControl.png'); background-size: cover; background-position: center;">

    <div class="auth-container">
        <div class="circle-decoration"></div>
        <div class="circle-decoration"></div>

        <div class="auth-box">
            <div class="auth-logo">
                <div class="logo-icon">
                    <img src="https://raw.githubusercontent.com/RichardAn2024/Gerenciador-de-Tarefas/main/images/VolControl.png"
                        alt="VolControl" class="logo-img" />
                </div>
                <div class="logo-text">Vol<span>Control</span></div>
            </div>

            <h2>🔑 Recuperar Senha</h2>
            <p>Digite seu email para receber o código de recuperação</p>

            <div id="mensagemSucesso" class="auth-success" style="display:none;"></div>
            <div id="mensagemErro" class="auth-error" style="display:none;"></div>

            <form id="recuperarForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="recuperarEmail" placeholder="seu@email.com" required />
                </div>

                <button type="submit" class="btn btn-primary btn-full">📧 Enviar código</button>
            </form>

            <div class="auth-links">
                <p><a href="login.html">← Voltar para o login</a></p>
            </div>
        </div>
    </div>

    <style>
        .auth-success {
            background: rgba(232, 245, 233, 0.9);
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            border-left: 4px solid #2e7d32;
            backdrop-filter: blur(4px);
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('recuperarForm');
            const emailInput = document.getElementById('recuperarEmail');
            const msgSucesso = document.getElementById('mensagemSucesso');
            const msgErro = document.getElementById('mensagemErro');

            const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:8080/api'
                : window.location.origin + '/api';

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                msgSucesso.style.display = 'none';
                msgErro.style.display = 'none';

                const email = emailInput.value.trim();

                if (!email) {
                    msgErro.textContent = 'Digite seu email.';
                    msgErro.style.display = 'block';
                    return;
                }

                try {
                    const response = await fetch(`${API_URL}/recuperar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        msgSucesso.textContent = data.mensagem || '📧 Código enviado! Verifique seu email.';
                        msgSucesso.style.display = 'block';
                        emailInput.value = '';

                        setTimeout(() => {
                            window.location.href = `resetar.html?email=${encodeURIComponent(email)}`;
                        }, 3000);
                    } else {
                        msgErro.textContent = data.erro || 'Erro ao enviar código.';
                        msgErro.style.display = 'block';
                    }
                } catch (error) {
                    console.error('❌ Erro na recuperação:', error);
                    msgErro.textContent = 'Erro de conexão com o servidor.';
                    msgErro.style.display = 'block';
                }
            });
        });
    </script>
</body>

</html>
